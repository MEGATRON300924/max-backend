name: Temporary Prisma dependency compatibility check

on:
  push:
    branches:
      - feat/github-app-user-access

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test patched deepmerge-ts override against Prisma 6
        run: |
          set -e
          npm pkg set 'overrides.deepmerge-ts=^8.0.0'
          npm install
          npx prisma generate
          npm run typecheck
          npm run build
          npm test -- --passWithNoTests
          npm audit || true
      - name: Commit override only if Prisma validation passes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/temp-prisma-override-check.yml
          git commit -m "fix: override vulnerable Prisma merge utility"
          git push origin HEAD:${{ github.ref_name }}
      - name: Remove temporary workflow after failed validation
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-prisma-override-check.yml || true
          git commit -m "chore: remove temporary Prisma override workflow" || true
          git push origin HEAD:${{ github.ref_name }} || true
