name: Production Prisma Recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RECOVER-MAX-BACKEND-PRODUCTION to authorize the approved migration recovery'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: max-backend-production-prisma-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.confirmation == 'RECOVER-MAX-BACKEND-PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev

      - name: Validate production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub Actions secret DATABASE_URL is not configured."
            exit 1
          fi

      - name: Resolve the known failed audit-events migration as rolled back
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate resolve --rolled-back 20260904163000_audit_events --schema prisma/schema.prisma

      - name: Apply remaining migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy --schema prisma/schema.prisma
